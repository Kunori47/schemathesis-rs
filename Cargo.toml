[workspace]
members = [
    "crates/schemathesis-core",
    "crates/schemathesis-generator",
    "crates/schemathesis-runner",
    "crates/schemathesis-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
schemathesis-core = { path = "crates/schemathesis-core" }
schemathesis-generator = { path = "crates/schemathesis-generator" }
schemathesis-runner = { path = "crates/schemathesis-runner" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5", features = ["derive"] }
